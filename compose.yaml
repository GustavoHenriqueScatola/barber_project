services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: "${BARBER_DB_NAME:-barber}"
      POSTGRES_USER: "${BARBER_DB_USER:-barber}"
      POSTGRES_PASSWORD: "${BARBER_DB_PASSWORD:?Defina BARBER_DB_PASSWORD em .env}"
    ports:
      - "127.0.0.1:${BARBER_DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "${BARBER_DB_USER:-barber}", "-d", "${BARBER_DB_NAME:-barber}"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
